<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#E4F0F4" />
  <meta name="description" content="BEBU Store — catálogo de productos para bebés." />
  <script>
    document.documentElement.dataset.layout = window.matchMedia('(min-width: 900px)').matches ? 'web' : 'app';
  </script>
  <title>BEBU Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=More+Sugar&family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>
<body>
  <div id="update-banner" class="hidden" role="status" aria-live="polite">
    <div class="update-inner">
      <span>Nueva versión disponible</span>
      <button id="btn-update-now" type="button" class="btn-ghost">Actualizar</button>
      <button id="btn-update-later" type="button" class="btn-ghost">Cerrar</button>
    </div>
  </div>

  <header class="site-header" id="site-header" role="banner">
    <div class="header-inner">
      <div class="brand-mark">
        <img id="logo-local" class="logo-app" src="/logo.png" alt="BEBU Store" width="48" height="64" decoding="async" />
      </div>
      <nav class="bottom-nav" id="bottom-nav" aria-label="Navegación principal">
        <button type="button" class="bottom-nav-btn is-active" data-nav="home" aria-label="Inicio" aria-current="page">
          <span class="bottom-nav-ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          <span class="bottom-nav-label">Inicio</span>
        </button>
        <button type="button" class="bottom-nav-btn" data-nav="promos" aria-label="Promociones">
          <span class="bottom-nav-ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 3l2.2 4.5 5 .7-3.6 3.5.9 5L12 14.8 7.5 16.7l.9-5L4.8 8.2l5-.7L12 3z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          </span>
          <span class="bottom-nav-label">Promos</span>
        </button>
        <button type="button" class="bottom-nav-btn" data-nav="search" aria-label="Buscador">
          <span class="bottom-nav-ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </span>
          <span class="bottom-nav-label">Buscar</span>
        </button>
        <button type="button" class="bottom-nav-btn" data-nav="cart" aria-label="Carrito">
          <span class="bottom-nav-ico" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 6h15l-1.5 9h-12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 6L5 3H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="20" r="1.4" fill="currentColor"/><circle cx="18" cy="20" r="1.4" fill="currentColor"/></svg>
          </span>
          <span class="bottom-nav-label">Carrito</span>
          <span id="contador-nav-carrito" class="badge-nav" hidden>0</span>
        </button>
      </nav>
    </div>
    <div class="header-divider" aria-hidden="true"></div>
  </header>
  <div class="header-spacer" id="header-spacer" aria-hidden="true"></div>

  <main id="app-container" class="main-container content" role="main">
    <section id="home-view" class="section active">
      <div id="home-carousels" class="home-carousels" aria-label="Productos destacados"></div>
      <div class="sec-label">Secciones</div>
      <div id="sections-grid" class="sections-grid"></div>
    </section>
    <section id="brands-view" class="section">
      <div class="sec-head">
        <button id="btn-volver-brands" class="btn-volver" type="button" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Volver
        </button>
        <div class="sec-label" id="brands-label">Marcas</div>
      </div>
      <div id="brands-grid" class="brands-grid"></div>
    </section>
    <section id="subcats-view" class="section">
      <div class="sec-head">
        <button id="btn-volver" class="btn-volver" type="button" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Volver
        </button>
        <div class="sec-label" id="subcats-label">Líneas</div>
      </div>
      <div id="subcats-grid" class="subcats-grid"></div>
    </section>
    <section id="products-view" class="section">
      <div class="sec-head">
        <button id="btn-volver-products" class="btn-volver" type="button" aria-label="Volver">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Volver
        </button>
        <div class="sec-label" id="products-label">Productos</div>
      </div>
      <div id="products-grid" class="products-grid"></div>
    </section>
  </main>

  <div id="modal-promos" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="promos-titulo" aria-hidden="true">
    <div class="modal-card cart-sheet search-sheet" role="document">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="promos-titulo">Promos</h2>
        <button id="btn-cerrar-promos" class="close-btn" type="button" aria-label="Cerrar promociones">&times;</button>
      </div>
      <div class="sec-label" id="promos-count-label">Promociones activas</div>
      <div id="promos-grid" class="search-results-grid modal-search-grid"></div>
    </div>
  </div>

  <div id="modal-buscar" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="buscar-titulo" aria-hidden="true">
    <div class="modal-card cart-sheet search-sheet" role="document">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="buscar-titulo">Buscar</h2>
        <button id="btn-cerrar-buscar" class="close-btn" type="button" aria-label="Cerrar buscador">&times;</button>
      </div>
      <div class="buscador-container">
        <label class="search-field" for="buscador">
          <svg class="search-ico" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="buscador" type="search" placeholder="Productos, marcas, líneas..." aria-label="Buscar productos" autocomplete="off" enterkeyhint="search" />
        </label>
      </div>
      <div class="sec-label" id="search-count-label">Escribí para buscar</div>
      <div id="search-grid" class="search-results-grid modal-search-grid"></div>
    </div>
  </div>

  <div id="modal-carrito" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-card cart-sheet" role="document">
      <div class="sheet-handle" aria-hidden="true"></div>
      <div class="modal-header">
        <h2 id="modal-titulo">Tu pedido</h2>
        <button id="btn-cerrar-carrito" class="close-btn" type="button" aria-label="Cerrar carrito">&times;</button>
      </div>
      <div id="lista-carrito-modal" class="modal-body-list"></div>
      <div class="checkout-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="switch-envio" />
          Envío a domicilio
        </label>
        <div class="pay-options" role="radiogroup" aria-label="Forma de pago">
          <span class="pay-options-label">Forma de pago</span>
          <label class="checkbox-label">
            <input type="radio" name="pago" id="pago-efectivo" value="efectivo" />
            Efectivo
          </label>
          <label class="checkbox-label">
            <input type="radio" name="pago" id="pago-transferencia" value="transferencia" />
            Transferencia
          </label>
        </div>
        <button id="btn-abrir-direccion" class="btn-secondary" type="button" hidden>Ingresar dirección</button>
      </div>
      <div class="totales-desglose">
        <div class="desglose-linea"><span>Subtotal</span><span id="subtotal-modal">$0</span></div>
        <div class="desglose-linea" id="linea-envio" hidden><span>Envío</span><span id="envio-valor">$0</span></div>
        <div class="desglose-linea total-modal"><span>Total</span><span id="total-final-modal">$0</span></div>
      </div>
      <button id="btn-enviar-whatsapp" type="button" class="btn-checkout green">Finalizar compra por WhatsApp</button>
      <button id="btn-vaciar-carrito" type="button" class="btn-checkout back">Vaciar carrito</button>
    </div>
  </div>

  <div id="modal-direccion" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card-small" role="document">
      <div class="modal-header">
        <h2>Dirección de envío</h2>
        <button id="close-direccion-btn" class="close-btn" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body-direccion">
        <input id="input-direccion" type="text" placeholder="Calle, número, barrio, ciudad" aria-label="Dirección de envío" />
      </div>
      <div class="modal-footer">
        <button id="btn-guardar-direccion" type="button" class="btn-checkout green">Guardar dirección</button>
        <button id="close-direccion-btn-2" type="button" class="btn-checkout back">Cancelar</button>
      </div>
    </div>
  </div>

  <div id="modal-oferta" class="modal-overlay offer-overlay" role="dialog" aria-modal="true" aria-labelledby="offer-titulo" aria-hidden="true">
    <div class="offer-card" role="document">
      <h2 id="offer-titulo" class="visually-hidden">Oferta</h2>
      <button id="btn-cerrar-oferta" class="offer-close" type="button" aria-label="Cerrar oferta">&times;</button>
      <div id="offer-stage" class="offer-stage"></div>
      <div id="offer-dots" class="offer-dots" hidden></div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
