<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#EBE7D8" />
  <meta name="description" content="BEBU Store — catálogo de productos para bebés." />
  <title>BEBU Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=More+Sugar&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/png" href="/logo.png" />
</head>
<body>
  <div id="update-banner" class="hidden" role="status" aria-live="polite">
    <div class="update-inner">
      <span>Nueva versión disponible</span>
      <button id="btn-update-now" type="button" class="btn-ghost">Actualizar</button>
      <button id="btn-update-later" type="button" class="btn-ghost">Cerrar</button>
    </div>
  </div>

  <header class="header-pro" id="site-header" role="banner" style="--collapse: 0">
    <div class="header-shell">
      <div class="header-content-row">
        <div class="header-side header-left-group">
          <button id="btn-volver" class="btn-header-icon" type="button" hidden aria-label="Volver">←</button>
        </div>
        <div class="header-center-group">
          <div class="logo-stack" aria-hidden="false">
            <img
              id="logo-sheet"
              class="logo-layer logo-sheet"
              src="/logo.png"
              alt=""
              decoding="async"
            />
            <img
              id="logo-local"
              class="logo-layer logo-local"
              src="/logo.png"
              alt="BEBU Store"
              width="120"
              height="48"
              decoding="async"
            />
          </div>
        </div>
        <div class="header-side header-right-group">
          <button id="btn-carrito-header" class="btn-header-icon btn-header-cart" type="button" aria-label="Abrir carrito" aria-expanded="false">
            <span class="cart-emoji" aria-hidden="true">🛒</span>
            <span id="contador-carrito" class="badge-carrito" hidden>0</span>
          </button>
        </div>
      </div>
      <div class="buscador-container">
        <input id="buscador" type="search" placeholder="Buscar productos, marcas o categorías..." aria-label="Buscar productos" autocomplete="off" enterkeyhint="search" />
      </div>
    </div>
  </header>
  <div class="header-spacer" id="header-spacer" aria-hidden="true"></div>

  <main id="app-container" class="main-container content" role="main">
    <section id="brands-view" class="section active">
      <div class="sec-label">Marcas</div>
      <div id="brands-grid" class="brands-grid"></div>
    </section>
    <section id="subcats-view" class="section">
      <div class="sec-label" id="subcats-label">Líneas</div>
      <div id="subcats-grid" class="subcats-grid"></div>
    </section>
    <section id="products-view" class="section">
      <div class="sec-label" id="products-label">Productos</div>
      <div id="products-grid" class="products-grid"></div>
    </section>
    <section id="search-view" class="section">
      <div class="sec-label" id="search-count-label">Resultados</div>
      <div id="search-grid" class="search-results-grid"></div>
    </section>
  </main>

  <div id="modal-carrito" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" aria-hidden="true">
    <div class="modal-card" role="document">
      <div class="modal-header">
        <h2 id="modal-titulo">Tu pedido</h2>
        <button id="btn-cerrar-carrito" class="close-btn" type="button" aria-label="Cerrar carrito">&times;</button>
      </div>
      <div id="lista-carrito-modal" class="modal-body-list"></div>
      <div class="checkout-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="switch-envio" />
          Envío a domicilio
        </label>
        <label class="checkbox-label">
          <input type="checkbox" id="switch-transferencia" />
          Pago por transferencia
        </label>
        <button id="btn-abrir-direccion" class="btn-secondary" type="button" hidden>Ingresar dirección</button>
      </div>
      <div class="totales-desglose">
        <div class="desglose-linea"><span>Subtotal</span><span id="subtotal-modal">$0</span></div>
        <div class="desglose-linea" id="linea-envio" hidden><span>Envío</span><span id="envio-valor">$0</span></div>
        <div class="desglose-linea total-modal"><span>Total</span><span id="total-final-modal">$0</span></div>
      </div>
      <button id="btn-enviar-whatsapp" type="button" class="btn-checkout green">Enviar pedido por WhatsApp</button>
      <button id="btn-vaciar-carrito" type="button" class="btn-checkout back">Vaciar carrito</button>
    </div>
  </div>

  <div id="modal-direccion" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card-small" role="document">
      <div class="modal-header">
        <h2>Dirección de envío</h2>
        <button id="close-direccion-btn" class="close-btn" type="button" aria-label="Cerrar">&times;</button>
      </div>
      <div class="modal-body-direccion">
        <input id="input-direccion" type="text" placeholder="Calle, número, barrio, ciudad" aria-label="Dirección de envío" />
      </div>
      <div class="modal-footer">
        <button id="btn-guardar-direccion" type="button" class="btn-checkout green">Guardar dirección</button>
        <button id="close-direccion-btn-2" type="button" class="btn-checkout back">Cancelar</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
