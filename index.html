<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#EBE7D8" />
  <meta name="description" content="BEBU Store - Catálogo profesional de productos para bebés." />
  <title>BEBU Store - Catálogo Profesional</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=More+Sugar&family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo-192.png" />
</head>
<body>
  <!-- UPDATE BANNER (hidden until SW signals new version) -->
  <div id="update-banner" class="hidden" role="status" aria-live="polite">
    <div class="update-inner">
      <span>Nueva versión disponible</span>
      <button id="btn-update-now" class="btn-ghost">Actualizar</button>
      <button id="btn-update-later" class="btn-ghost">Cerrar</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="header-pro" role="banner">
    <div class="header-content-row">
      <div class="header-left-group">
        <button id="btn-volver" class="btn-control-volver" style="display:none" aria-label="Volver">⬅ Volver</button>
        <img id="logo-global" class="logo-app-pro" src="/icons/logo-192.png" alt="BEBU Store" loading="lazy">
      </div>

      <div class="header-right-group">
        <button id="btn-carrito-header" class="btn-control-carrito" aria-label="Abrir carrito">
          🛒 Carrito <span id="contador-carrito" class="badge-carrito" style="display:none">0</span>
        </button>
      </div>
    </div>

    <div class="buscador-container">
      <input id="buscador" type="text" placeholder="🔍 Buscar productos, marcas o categorías..." aria-label="Buscar productos" autocomplete="off">
    </div>
  </header>

  <!-- Breadcrumb -->
  <div id="breadcrumb" class="breadcrumb hidden" aria-hidden="true"></div>

  <!-- MAIN -->
  <main id="app-container" class="main-container content" role="main">
    <!-- BRANDS VIEW -->
    <section id="brands-view" class="section active">
      <div class="sec-label">Marcas</div>
      <div id="brands-grid" class="brands-grid"></div>
    </section>

    <!-- SUBCATEGORIES -->
    <section id="subcats-view" class="section">
      <div class="sec-label" id="subcats-label">Líneas</div>
      <div id="subcats-grid" class="subcats-grid"></div>
    </section>

    <!-- PRODUCTS -->
    <section id="products-view" class="section">
      <div class="sec-label" id="products-label">Productos</div>
      <div id="products-grid" class="products-grid"></div>
    </section>

    <!-- SEARCH RESULTS -->
    <section id="search-view" class="section">
      <div class="sec-label" id="search-count-label">Resultados</div>
      <div id="search-grid" class="search-results-grid"></div>
    </section>
  </main>

  <!-- CART MODAL / DRAWER -->
  <div id="modal-carrito" class="modal-overlay" role="dialog" aria-hidden="true" style="display:none">
    <div class="modal-card" role="document">
      <div class="modal-header">
        <h2 id="modal-titulo">Tu Pedido Actual</h2>
        <button class="close-btn" aria-label="Cerrar modal">&times;</button>
      </div>

      <div id="lista-carrito-modal" class="modal-body-list"></div>

      <div class="checkout-controls">
        <label class="checkbox-label">
          <input type="checkbox" id="switch-envio" aria-label="Incluir envío a domicilio">
          🛵 Envío a domicilio
        </label>

        <label class="checkbox-label">
          <input type="checkbox" id="switch-transferencia" aria-label="Pago por transferencia">
          🏦 Pago por Transferencia / Efectivo
        </label>
      </div>

      <div class="totales-desglose">
        <div class="desglose-linea">
          <span>Subtotal:</span>
          <span id="subtotal-modal">$0</span>
        </div>
        <div class="desglose-linea" id="linea-envio" style="display:none">
          <span>Envío:</span>
          <span>+ $0</span>
        </div>
        <div class="desglose-linea total-modal">
          <span>Total:</span>
          <span id="total-final-modal">$0</span>
        </div>
      </div>

      <button id="btn-enviar-whatsapp" class="btn-checkout green">Enviar Pedido por WhatsApp 🟢</button>
      <button class="btn-vaciar-carrito btn-checkout back">Vaciar Carrito</button>
    </div>
  </div>

  <!-- App script -->
  <script src="app.js" defer></script>

  <!-- Service Worker registration + update message handling -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(reg => {
          // If there's an updated SW waiting, ask it to skip waiting
          if (reg.waiting) {
            // notify user that new version is available
            navigator.serviceWorker.controller && navigator.serviceWorker.controller.postMessage({ type: 'CHECK_NEW_VERSION' });
          }
          // listen for updatefound (new installing SW)
          reg.addEventListener('updatefound', () => {
            const newSW = reg.installing;
            newSW.addEventListener('statechange', () => {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                // New content available, notify client when SW activates
                console.log('Service worker installed — new version available');
              }
            });
          });
        }).catch(err => console.warn('SW registration failed:', err));
      }

      // Listen messages from SW
      navigator.serviceWorker && navigator.serviceWorker.addEventListener && navigator.serviceWorker.addEventListener('message', (ev) => {
        const data = ev.data || {};
        if (data && data.type === 'NEW_VERSION') {
          // show update banner
          const banner = document.getElementById('update-banner');
          if (banner) banner.classList.remove('hidden');
        }
      });

      // Banner buttons
      document.addEventListener('DOMContentLoaded', () => {
        const btnNow = document.getElementById('btn-update-now');
        const btnLater = document.getElementById('btn-update-later');
        if (btnNow) btnNow.addEventListener('click', () => {
          // Ask waiting SW to skipWaiting, then reload when controlling
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.getRegistration().then(reg => {
              if (reg && reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          }
          // small delay to let SW activate
          setTimeout(() => location.reload(true), 800);
        });
        if (btnLater) btnLater.addEventListener('click', () => {
          const banner = document.getElementById('update-banner');
          banner && banner.classList.add('hidden');
        });
      });
    })();
  </script>
</body>
</html>
